# Dedicated-host overlay: serve the dashboard at the domain root from a local front-door
# container. The base production stack keeps its TLS listener private; the front door owns :80.
#
# Usage, from the repository root:
#
#   docker compose --env-file infra/.env.production \
#     -f infra/docker-compose.prod.yml -f infra/docker-compose.standalone.yml up -d --build
services:
  web:
    build:
      args:
        VITE_BASE_PATH: /
    # The front door publishes :80; the stack's own TLS listener stays on the compose network.
    ports: !reset []
  frontdoor:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '${FRONTDOOR_PORT:-80}:80'
      - '${FRONTDOOR_TLS_PORT:-443}:443'
    volumes:
      - ./nginx/frontdoor.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [internal]
