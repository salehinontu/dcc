# EMQX 5 configuration for the DJI fleet deployment.
#
# Authentication and authorization are delegated to the API:
#   POST http://api:3000/internal/mqtt/auth   -> {"result":"allow"|"deny"}
#   POST http://api:3000/internal/mqtt/acl    -> {"result":"allow"|"deny"}
#
# The API issues one credential per controller serial number, so a controller can only
# publish its own telemetry and subscribe to its own service topics.
#
# The cookie here is the image default; production overrides it with EMQX_NODE__COOKIE
# from infra/.env.production.

node {
    name = "emqx@127.0.0.1"
    cookie = "emqxsecretcookie"
    data_dir = "data"
}

cluster {
    name = emqxcl
    discovery_strategy = manual
}

listeners.tcp.default {
    bind = "0.0.0.0:1883"
}

listeners.ssl.default {
    bind = "0.0.0.0:8883"
    ssl_options {
        # Mount the certificate that covers the mqtt hostname into /opt/emqx/etc/certs.
        certfile = "/opt/emqx/etc/certs/fullchain.pem"
        keyfile = "/opt/emqx/etc/certs/privkey.pem"
        cacertfile = "/opt/emqx/etc/certs/fullchain.pem"
    }
}

# Not published by Compose, but EMQX starts it by default. Give it the same certificate
# instead of letting it look for the image's missing cert.pem/key.pem/cacert.pem.
listeners.wss.default {
    bind = "0.0.0.0:8084"
    ssl_options {
        certfile = "/opt/emqx/etc/certs/fullchain.pem"
        keyfile = "/opt/emqx/etc/certs/privkey.pem"
        cacertfile = "/opt/emqx/etc/certs/fullchain.pem"
    }
}

authentication = [
    {
        mechanism = password_based
        backend = http
        method = post
        url = "http://api:3000/internal/mqtt/auth"
        headers {
            "content-type" = "application/json"
        }
        body {
            username = "${username}"
            password = "${password}"
        }
    }
]

authorization {
    # Permission changes must apply to the next MQTT action.
    cache { enable = false }
    no_match = deny
    sources = [
        {
            type = http
            method = post
            url = "http://api:3000/internal/mqtt/acl"
            headers {
                "content-type" = "application/json"
            }
            body {
                username = "${username}"
                topic = "${topic}"
                action = "${action}"
            }
        }
    ]
}
