# Development EMQX configuration: plain MQTT on 1883, with authentication and ACLs
# delegated to the API exactly as in production. Production adds TLS on 8883.

node {
    name = "emqx@127.0.0.1"
    cookie = "emqxsecretcookie"
    data_dir = "data"
}

cluster {
    name = emqxcl
    discovery_strategy = manual
}

listeners.tcp.default {
    bind = "0.0.0.0:1883"
}

authentication = [
    {
        mechanism = password_based
        backend = http
        method = post
        url = "http://api:3000/internal/mqtt/auth"
        headers {
            "content-type" = "application/json"
        }
        body {
            username = "${username}"
            password = "${password}"
        }
    }
]

authorization {
    cache { enable = false }
    no_match = deny
    sources = [
        {
            type = http
            method = post
            url = "http://api:3000/internal/mqtt/acl"
            headers {
                "content-type" = "application/json"
            }
            body {
                username = "${username}"
                topic = "${topic}"
                action = "${action}"
            }
        }
    ]
}
