listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled         on;
    listen          8000;
    # Must be the address a browser can reach. On a cloud VM set CANDIDATE to the public IP.
    candidate       $CANDIDATE;
}

vhost __defaultVhost__ {
    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    http_hooks {
        enabled     on;
        # host.docker.internal works with Docker Desktop and the host-gateway mapping.
        # In production point these at the API service address.
        on_publish      http://host.docker.internal:3000/internal/srs/on_publish;
        on_unpublish    http://host.docker.internal:3000/internal/srs/on_unpublish;
    }
}
