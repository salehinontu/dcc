listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled         on;
    listen          8000;
    # The browser reaches this address. The Docker dev stack publishes 8000/udp.
    candidate       $CANDIDATE;
}

vhost __defaultVhost__ {
    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    http_hooks {
        enabled     on;
        # The API runs in the same Compose network in the Docker dev stack.
        on_publish      http://api:3000/internal/srs/on_publish;
        on_unpublish    http://api:3000/internal/srs/on_unpublish;
    }
}
