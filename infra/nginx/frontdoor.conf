# Standalone front door for a dedicated host. The dashboard is built at the origin root;
# this proxy forwards the SPA, API, WebSocket and WHEP signalling to the stack's own TLS
# listener. Mounted at /etc/nginx/conf.d/default.conf inside the frontdoor container.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# HTTP: keep the healthcheck local and move everything else to the domain over TLS.
server {
  listen 80 default_server;
  server_name _;
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location / {
    return 301 https://fleet.example.com$request_uri;
  }
}

# HTTPS: the dashboard and Pilot page at the origin root, using the wildcard certificate.
server {
  listen 443 ssl;
  http2 on;
  server_name fleet.example.com;
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_max_body_size 12m;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Old path-prefix links keep working.
  location = /drone-fleet {
    return 301 /;
  }

  location /drone-fleet/ {
    rewrite ^/drone-fleet/(.*)$ /$1 permanent;
  }

  location / {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_upstream https://web:443;
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    proxy_hide_header Strict-Transport-Security;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
