# Security headers for every answer. Nginx drops the server-level add_header lines in any location that has its own
# add_header, so each such location includes this file again.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Nobody may frame the dashboard (clickjacking); DJI Pilot 2 opens /pilot as a page, not in a frame.
add_header X-Frame-Options SAMEORIGIN always;
# The dashboard never uses the camera, microphone, location, payments or USB, so no page may ask for them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# The parts of a Content-Security-Policy that cannot break the app: no framing, no <base> or plugin tricks, forms post
# only here. (Scripts and styles are left alone: the map, the video player and the branding colours need more care.)
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
