# RTMPS: TLS in front of the media server, for encoders that can push rtmps://.
#
# Nginx accepts the TLS connection and hands the plain RTMP stream to SRS on the compose network, so the video
# and the stream key are encrypted between the encoder and this server. Port 1935 (plain RTMP) stays as it is,
# because the DJI apps are only known to push plain RTMP; clients that can do RTMPS use this port instead.
#
# This file is mounted at /etc/nginx/stream.d/rtmps.conf by docker-compose.prod.yml; the image's nginx.conf
# includes that folder at the top level, which is where a `stream` block has to live. The certificate is the
# one the dashboard already uses.
stream {
    # Docker's embedded DNS, and SRS named through a variable: like the dashboard's proxy, this survives SRS
    # being recreated. A fixed name would be looked up once at start-up, and Nginx would refuse to start (and
    # take the dashboard down with it) whenever SRS happened not to be there yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Who connected, when, how much was sent, never the stream key (it is inside the encrypted stream).
    log_format rtmps '$remote_addr [$time_local] RTMPS $status in=$bytes_received out=$bytes_sent t=$session_time';
    access_log /dev/stdout rtmps;

    server {
        listen 1936 ssl;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:RTMPS:2m;
        ssl_session_timeout 1h;

        set $media_upstream srs:1935;
        proxy_pass $media_upstream;
        proxy_connect_timeout 10s;
        # An encoder sends all the time; a connection that says nothing for this long is gone.
        proxy_timeout 1h;
    }
}
